%YAML:1.0

#--------------------------------------------------------------------------------------------
# System config
#--------------------------------------------------------------------------------------------

# When the variables are commented, the system doesn't load a previous session or not store the current one
#System.LoadAtlasFromFile: "Session_ETH3D_CameraShake1_Mono"
#System.SaveAtlasToFile: "Session_ETH3D_CameraShake1_Mono"

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
# Data from calib.txt: 726.287 726.287 354.650 186.466
Camera1.fx: 726.28741455078
Camera1.fy: 726.28741455078
Camera1.cx: 354.6496887207
Camera1.cy: 186.46566772461

# Distortion coefficients
# Note: Your provided calib.txt did not include distortion values. 
# Assuming 0.0 (undistorted or negligible). If tracking fails, check for k1,k2,p1,p2 in original dataset docs.
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Original Image Resolution (Left camera rgb folder)
Camera.width: 739
Camera.height: 458

# Scaled Image Resolution (Optional: ORB-SLAM3 resizes images internally for speed)
# Keeping aspect ratio: 739/458 ≈ 1.61. Target width ~600 -> height ~372
Camera.newWidth: 600
Camera.newHeight: 372

# Camera frames per second 
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB)
# ETH3D images are RGB
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
# Increased slightly from EuroC default (1000) due to higher resolution/features
ORBextractor.nFeatures: 8000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0